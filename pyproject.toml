[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awvgeneric"
version = "0.1.0"
description = "Python SDK for AWV road infrastructure asset management (EM-Infra, Davie, ServiceNow Gateway, etc.)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "AWV Team" }
]
keywords = ["awv", "eminfra", "otl", "infrastructure", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests",
    "pyjwt[crypto]>=1.3.1",
    "pandas",
    "geopandas",
    "openpyxl",
    "tqdm",
    "prettytable",
    "pytz",
    "msal",
    "shapely",
    "python-dateutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["API", "utils"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E722", "S110", "BLE001", "S307", "S302", "S101", "E712", "E721", "B006",
    "B009", "B010", "B904", "TRY003", "TRY300", "F403", "F401", "TID252", "PTH",
    "T201", "G004", "G010", "LOG015", "LOG014", "G101", "RUF013", "UP006",
    "UP004", "UP035", "PLW0602", "PLR0913", "PLR0917", "PLR0911", "ARG001",
    "PLR2004",
]
# API/clients/emson.py uses relative imports inside the package; the whole
# API package is a single import unit here, so TID252 is intentionally off.
ignore = ["TID252"]

[tool.ruff.lint.per-file-ignores]
"code_quality/scripts/*" = ["TID252"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["UnitTests"]
python_files = ["*_tests.py", "test_*.py"]
python_functions = ["test_*"]
