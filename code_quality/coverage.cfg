# Coverage configuration for the quality gate.
# Kept separate from pyproject.toml so it cannot interfere with any other
# coverage measurement.
#
# Use it with:
#   COVERAGE_RCFILE=code_quality/coverage.cfg
#   pytest --cov=API --cov-report=json:code_quality/reports/coverage.json

[run]
source = API
branch = true
omit =
    */__pycache__/*
    */site-packages/*

[report]
exclude_also =
    if TYPE_CHECKING:
    raise NotImplementedError
    @abstractmethod
    @overload
    if __name__ == .__main__.
    pragma: no cover
show_missing = true
skip_covered = false